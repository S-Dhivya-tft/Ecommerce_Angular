<mat-card class="category-card">
  <mat-card-title class="category-title">📂 Manage Categories</mat-card-title>
  <mat-card-content>
    <table mat-table [dataSource]="dataList" class="custom-table mat-elevation-z8">

      <!-- S No Column -->
      <ng-container matColumnDef="sno">
        <th mat-header-cell *matHeaderCellDef> # </th>
        <td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 }} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Category Name </th>
        <td mat-cell *matCellDef="let element">
          <span *ngIf="!element.editing">{{ element.name }}</span>
          <input *ngIf="element.editing" [(ngModel)]="element.name" class="edit-input">
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element; let i = index">
          <button mat-stroked-button color="accent" (click)="editRow(element)">
            {{ element.editing ? '💾 Save' : '✏️ Edit' }}
          </button>
          <button mat-raised-button color="warn" (click)="deleteRow(element, i)">
            🗑️ Delete
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div class="add-button-container">
      <button mat-raised-button color="primary" (click)="addRow()">
        ➕ Add Category
      </button>
    </div>
  </mat-card-content>
</mat-card>
