<h2 mat-dialog-title>
    <mat-icon color="primary">shopping_cart</mat-icon> Confirm Your Order
  </h2>
  
  <mat-dialog-content class="dialog-content">
    <form #orderForm="ngForm">
      
      <!-- Payment Method -->
      <div class="form-group">
        <label class="section-title"><strong>Payment Method:</strong></label>
        <mat-radio-group [(ngModel)]="data.paymentType" name="paymentType" class="payment-options">
          <mat-radio-button value="COD">
            <mat-icon class="payment-icon">payments</mat-icon> Cash on Delivery
          </mat-radio-button>
          <mat-radio-button value="UPI">
            <mat-icon class="payment-icon">qr_code</mat-icon> UPI
          </mat-radio-button>
          <mat-radio-button value="Card">
            <mat-icon class="payment-icon">credit_card</mat-icon> Credit/Debit Card
          </mat-radio-button>
        </mat-radio-group>
      </div>
  
      <!-- Delivery Address -->
      <div class="form-group">
        <label class="section-title"><strong>Delivery Address:</strong></label>
  
        <mat-form-field appearance="outline">
          <mat-label>Street Address</mat-label>
          <input matInput type="text" [(ngModel)]="data.address.street" name="street" required />
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>City</mat-label>
          <input matInput type="text" [(ngModel)]="data.address.city" name="city" required />
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>ZIP Code</mat-label>
          <input matInput type="text" [(ngModel)]="data.address.zip" name="zip" required />
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>
  
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="confirmOrder()">
      <mat-icon>check_circle</mat-icon> Confirm Order
    </button>
  </mat-dialog-actions>
