<div class="admin-container">
  <mat-card class="admin-card">
    <mat-card-title class="admin-title">🛠️ Admin Dashboard</mat-card-title>
    <mat-card-content>
      <p class="welcome-text">Welcome, Admin! 🎉</p>
      <button mat-raised-button color="warn" (click)="logout()" class="logout-button">
        🔓 Logout
      </button>
    </mat-card-content>
  </mat-card>
</div>

<div class="top-buttons">
  <button mat-raised-button color="primary" (click)="goToOrders()">📦 View Orders</button>
</div>

<div class="button-container">
  <button mat-raised-button color="primary" [routerLink]="['/admin/categories']">
    🗂️ Manage Categories
  </button>
  <button mat-raised-button color="accent" [routerLink]="['/admin/brands']">
    🏷️ Manage Brands
  </button>
  <button mat-raised-button color="warn" [routerLink]="['/admin/products']">
    📦 Manage Products
  </button>
</div>
